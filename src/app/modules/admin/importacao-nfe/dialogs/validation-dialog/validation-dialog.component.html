<div class="flex flex-col max-w-160 w-full overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b bg-gray-50 dark:bg-transparent">
        <div class="text-lg font-bold">Validação de NF-e</div>
        <button mat-icon-button (click)="cancel()" [disabled]="isValidating()">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <div class="p-8">
        <div class="flex flex-col space-y-6">

            <!-- NF-e Info -->
            <div *ngIf="data.numeroNfe" class="flex flex-col p-4 bg-primary-50 rounded-lg border border-primary-100">
                <div class="text-sm font-semibold text-primary-700 uppercase tracking-wider">NF-e Detectada</div>
                <div class="text-xl font-bold mt-1">Nº {{data.numeroNfe}}</div>
                <div class="text-secondary text-sm">{{data.nomeFornecedor}}</div>
            </div>

            <!-- Validation Steps -->
            <div class="flex flex-col space-y-4">
                <div *ngFor="let step of steps(); let i = index"
                     class="flex items-start space-x-3 transition-all duration-300"
                     [ngClass]="{'opacity-40': i > currentStepIndex() && isValidating()}">

                    <!-- Icon/Spinner -->
                    <div class="flex shrink-0 items-center justify-center w-6 h-6 mt-0.5">
                        <mat-progress-spinner *ngIf="i === currentStepIndex() && isValidating()"
                                             [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>

                        <mat-icon *ngIf="step.success && (i < currentStepIndex() || !isValidating())"
                                  class="text-green-600 icon-size-6"
                                  [svgIcon]="'heroicons_solid:check-circle'"></mat-icon>

                        <mat-icon *ngIf="!step.success && (i <= currentStepIndex() && !isValidating())"
                                  class="text-red-600 icon-size-6"
                                  [svgIcon]="'heroicons_solid:x-circle'"></mat-icon>

                        <div *ngIf="i > currentStepIndex() && isValidating()"
                             class="w-5 h-5 rounded-full border-2 border-gray-300"></div>
                    </div>

                    <!-- Label & Message -->
                    <div class="flex flex-col">
                        <div class="font-semibold leading-6"
                             [ngClass]="{'text-green-700': step.success && !isValidating(), 'text-red-700': !step.success && !isValidating()}">
                            {{step.label}}
                        </div>
                        <div *ngIf="step.message" class="text-sm text-secondary mt-0.5 leading-relaxed">
                            {{step.message}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end px-6 py-4 space-x-3 border-t bg-gray-50 dark:bg-transparent">
        <button mat-button (click)="cancel()" [disabled]="isValidating()">
            Cancelar
        </button>
        <button mat-flat-button [color]="'primary'"
                (click)="confirm()"
                [disabled]="!isValid() || isValidating()">
            Confirmar Processamento
        </button>
    </div>
</div>
