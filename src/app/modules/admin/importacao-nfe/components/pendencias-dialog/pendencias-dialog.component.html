<div class="flex flex-col max-w-240 min-w-160 max-h-screen overflow-hidden">
    <div class="flex items-center justify-between px-6 py-4 bg-orange-600 text-on-primary">
        <div class="flex flex-col">
            <div class="text-lg font-bold">Pendências de Importação</div>
            <div class="text-sm opacity-80">NF-e ID: {{data.importacaoId}}</div>
        </div>
        <button mat-icon-button (click)="fechar()">
            <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <div class="p-6 overflow-y-auto">
        <div *ngIf="pendencias.length === 0" class="flex flex-col items-center justify-center p-8 text-secondary">
            <mat-icon class="icon-size-12 mb-2 text-green-500" [svgIcon]="'heroicons_outline:check-circle'"></mat-icon>
            <span>Nenhuma pendência pendente para esta importação.</span>
        </div>

        <div *ngIf="pendencias.length > 0">
            <div class="bg-card rounded-xl shadow overflow-hidden border border-gray-200">
                <table mat-table [dataSource]="pendencias" class="w-full">

                    <ng-container mat-column-id="item">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold w-16">Item</th>
                        <td mat-cell *matCellDef="let p"> {{p.itemNf}} </td>
                    </ng-container>

                    <ng-container mat-column-id="produto">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Produto</th>
                        <td mat-cell *matCellDef="let p">
                            <div class="flex flex-col py-2">
                                <span class="text-xs font-mono text-secondary">{{p.cProd}}</span>
                                <span class="font-medium leading-tight">{{p.xProd}}</span>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container mat-column-id="motivo">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Motivo</th>
                        <td mat-cell *matCellDef="let p">
                            <span class="text-xs font-bold text-orange-700">
                                {{p.motivo}}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container mat-column-id="status">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Status</th>
                        <td mat-cell *matCellDef="let p">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase border"
                                [ngClass]="p.status === 'PENDENTE' ? 'text-orange-600 border-orange-200 bg-orange-50' : 'text-green-600 border-green-200 bg-green-50'">
                                {{p.status}}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container mat-column-id="acoes">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold text-center">Ação</th>
                        <td mat-cell *matCellDef="let p" class="text-center">
                            <button *ngIf="p.status === 'PENDENTE'" mat-flat-button color="primary" 
                                class="scale-90" (click)="resolver(p)">
                                Resolver
                            </button>
                            <span *ngIf="p.status === 'RESOLVIDA'" class="text-xs text-green-600 font-bold flex items-center justify-center">
                                <mat-icon class="icon-size-4 mr-1" [svgIcon]="'heroicons_outline:check'"></mat-icon>
                                Resolvido
                            </span>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </div>
    </div>

    <div class="flex justify-end p-4 border-t bg-gray-50">
        <button mat-flat-button color="primary" (click)="fechar()">Fechar</button>
    </div>
</div>
