<div class="flex flex-col max-w-160">
    <div class="flex items-center justify-between px-6 py-4 bg-primary text-on-primary">
        <div class="text-lg font-bold">Resolver Pendência (De/Para)</div>
        <button mat-icon-button (click)="cancelar()" [disabled]="isLoading">
            <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <div class="p-6 bg-gray-50 border-b">
        <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-1">Dados do Item no XML</div>
        <div class="flex flex-col gap-1">
            <div class="text-sm font-mono bg-white p-2 rounded border border-gray-200">
                <span class="text-secondary mr-2">Cód:</span> {{data.pendencia.cProd}}
            </div>
            <div class="text-sm font-medium bg-white p-2 rounded border border-gray-200">
                {{data.pendencia.xProd}}
            </div>
        </div>
    </div>

    <form [formGroup]="resolucaoForm" class="p-6 flex flex-col gap-4">
        
        <!-- Associação de Insumo -->
        <mat-form-field class="w-full" subscriptSizing="dynamic">
            <mat-label>Insumo no Sistema</mat-label>
            <mat-select formControlName="idInsumo" [disabled]="isLoading">
                <mat-option *ngFor="let i of (insumos$ | async)" [value]="i.id">
                    {{i.descricao}} ({{i.codigo}})
                </mat-option>
            </mat-select>
            <mat-error *ngIf="resolucaoForm.get('idInsumo').hasError('required')">
                Associação com insumo é obrigatória
            </mat-error>
        </mat-form-field>

        <div class="grid grid-cols-2 gap-4">
            <!-- Unidade no Fornecedor -->
            <mat-form-field class="w-full" subscriptSizing="dynamic">
                <mat-label>Unidade no XML (Ex: CX, UN)</mat-label>
                <input matInput formControlName="unidadeComercialFornecedor" [readonly]="isLoading">
                <mat-error *ngIf="resolucaoForm.get('unidadeComercialFornecedor').hasError('required')">
                    Obrigatório
                </mat-error>
            </mat-form-field>

            <!-- Fator de Conversão -->
            <mat-form-field class="w-full" subscriptSizing="dynamic">
                <mat-label>Fator de Conversão</mat-label>
                <input matInput type="number" formControlName="fatorConversao" [readonly]="isLoading">
                <mat-hint>Ex: Se 1 CX = 10 UN, fator é 10</mat-hint>
                <mat-error *ngIf="resolucaoForm.get('fatorConversao').hasError('required')">
                    Obrigatório
                </mat-error>
            </mat-form-field>
        </div>

        <div class="flex justify-end gap-3 mt-4">
            <button mat-button (click)="cancelar()" [disabled]="isLoading">Cancelar</button>
            <button mat-flat-button color="primary" (click)="salvar()" 
                [disabled]="resolucaoForm.invalid || isLoading">
                <span *ngIf="!isLoading">Salvar e Reprocessar</span>
                <span *ngIf="isLoading" class="flex items-center gap-2">
                    <mat-icon class="animate-spin" [svgIcon]="'heroicons_outline:arrow-path'"></mat-icon>
                    Salvando...
                </span>
            </button>
        </div>
    </form>
</div>
