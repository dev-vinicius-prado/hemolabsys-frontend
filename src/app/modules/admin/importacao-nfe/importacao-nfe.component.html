<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
    <!-- Header -->
    <div class="relative flex flex-col flex-0 lg:flex-row lg:items-center lg:justify-between px-6 pt-6 pb-4 lg:pr-8 lg:pl-7 sm:pt-10 sm:pb-6 bg-primary-700 dark:bg-transparent">
        <div class="flex flex-col items-start flex-auto min-w-0">
            <div class="text-2xl sm:text-4xl font-extrabold tracking-tight leading-none text-on-primary dark:text-white">
                Importação NF-e
            </div>
            <div class="text-on-primary/80 mt-2">Importe notas fiscais eletrônicas via XML da SEFAZ para entrada automática de estoque.</div>
        </div>
        <div class="mt-4 lg:mt-0 flex items-center gap-3">
            <button class="fuse-mat-button-large bg-primary text-on-primary rounded-xl p-2 flex items-center border border-solid border-white"
                mat-flat-button (click)="abrirUpload()">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:cloud-arrow-up'"></mat-icon>
                <span class="ml-2">Importar XML</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">
        <div class="flex flex-col flex-auto overflow-y-auto -webkit-overflow-scrolling-touch">
            <div class="flex-auto p-6 sm:p-10">

                <!-- Filtros -->
                <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-end mb-6 bg-card p-4 rounded-2xl shadow border border-gray-200">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-secondary mb-1">Chave de Acesso</label>
                        <input class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none"
                            [(ngModel)]="filters.chaveAcesso" placeholder="Buscar por chave..." (keyup.enter)="aplicarFiltros()"/>
                    </div>
                    <div class="w-full sm:w-48">
                        <label class="block text-sm font-bold text-secondary mb-1">Status</label>
                        <select class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none"
                            [(ngModel)]="filters.status" (change)="aplicarFiltros()">
                            <option [ngValue]="null">Todos</option>
                            <option *ngFor="let status of statusOptions" [value]="status">{{status}}</option>
                        </select>
                    </div>
                    <button mat-flat-button color="primary" class="h-10 rounded-lg" (click)="aplicarFiltros()">
                        <mat-icon [svgIcon]="'heroicons_outline:magnifying-glass'"></mat-icon>
                        <span class="ml-2">Filtrar</span>
                    </button>
                </div>

                <!-- Tabela de Histórico -->
                <div class="bg-card rounded-2xl shadow overflow-hidden border border-gray-200">
                    <table mat-table [dataSource]="importacoes$" class="w-full">

                        <!-- Data Column -->
                        <ng-container matColumnDef="data">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Data Início</th>
                            <td mat-cell *matCellDef="let row"> {{row.createdAt | date:'dd/MM/yyyy HH:mm'}} </td>
                        </ng-container>

                        <!-- Nota Column -->
                        <ng-container matColumnDef="nota">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Nota</th>
                            <td mat-cell *matCellDef="let row"> {{row.numeroNota}} </td>
                        </ng-container>

                        <!-- Fornecedor Column -->
                        <ng-container matColumnDef="fornecedor">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Fornecedor</th>
                            <td mat-cell *matCellDef="let row">
                                <div class="flex flex-col">
                                    <span class="font-medium">{{row.nomeFornecedor}}</span>
                                    <span class="text-xs text-secondary">{{row.cnpjFornecedor}}</span>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Status Column -->
                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold">Status</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="px-2 py-1 rounded text-xs font-bold uppercase" [ngClass]="getStatusColor(row.status)">
                                    {{row.status}}
                                </span>
                            </td>
                        </ng-container>

                        <!-- Ações Column -->
                        <ng-container matColumnDef="acoes">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 font-bold text-center">Ações</th>
                            <td mat-cell *matCellDef="let row" class="text-center">
                                <button mat-icon-button (click)="verRelatorio(row.id)" matTooltip="Ver Relatório">
                                    <mat-icon [svgIcon]="'heroicons_outline:document-text'"></mat-icon>
                                </button>
                                <button *ngIf="row.status === 'PARCIALMENTE_IMPORTADA' || row.status === 'PROCESSANDO'"
                                    mat-icon-button (click)="verPendencias(row.id)" matTooltip="Ver Pendências">
                                    <mat-icon [svgIcon]="'heroicons_outline:exclamation-triangle'" class="text-orange-500"></mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 cursor-pointer"></tr>
                    </table>

                    <div *ngIf="(importacoes$ | async)?.length === 0" class="p-8 text-center text-secondary">
                        Nenhuma importação encontrada.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
